# 版本請與 bilingual_subtitle_factory/__init__.py 的 __version__ 保持一致。
# [project.dependencies] 加上 [project.optional-dependencies].full
# 即為 requirements.txt 的完整產線依賴。

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-subtitle-factory"
version = "0.8.0"
description = "從 YouTube 官方 CC 與音軌強制對齊，產生高品質雙語字幕"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.11.4",
    "youtube-transcript-api>=0.6.2,<1",
]

[project.optional-dependencies]
full = [
    "openai-whisper>=20231117",
    "stable-ts>=2.17.5",
    "demucs>=4.0.1",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "tqdm>=4.66.0",
    "ffmpeg-python>=0.2.0",
]

[project.scripts]
create-bilingual = "bilingual_subtitle_factory.cli:main"
bilingualize = "bilingualize:main"

[project.urls]
Homepage = "https://github.com/NEOreload2025/subtitle_project_summary"
Source = "https://github.com/NEOreload2025/subtitle_project_summary"

[tool.setuptools]
packages = ["bilingual_subtitle_factory", "bilingual_subtitle_factory.core"]
py-modules = ["bilingualize", "hybrid_v8_enterprise"]
